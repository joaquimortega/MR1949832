# See OrtegaCerdaSeip/VENDORED.md.
[[lean_lib]]
name = "OrtegaCerdaSeip"

[[lean_lib]]
name = "OrtegaCerdaMultipliers"

# Self-contained statements file and its solution, checked by `comparator` (see comparator/).
[[lean_lib]]
name = "OCChallenge"

[[lean_lib]]
name = "OCSolution"
