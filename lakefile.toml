name = "OrtegaCerdaMultipliers"
version = "0.1.0"
defaultTargets = ["OrtegaCerdaMultipliers"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
