# formalization.yaml (v0.4): repo-root metadata for this formalization project.

version: "v0.4"

project:
  name: "Multipliers and weighted ∂̄-estimates (Ortega-Cerdà 2002)"
  description: >-
    A Lean 4 / Mathlib formalization of J. Ortega-Cerdà, "Multipliers and weighted ∂̄-estimates",
    Rev. Mat. Iberoamericana 18 (2002), 355–377.

    Multipliers (Theorem 4, Proposition 2). Let ψ be a subharmonic function in the plane or in
    the unit disc whose Laplacian is a locally doubling measure that gives mass > 1 to every disc
    of some fixed radius (Euclidean, resp. hyperbolic). Then there is a holomorphic h whose
    modulus is comparable to e^ψ away from small discs around its zeros. There are also finitely
    many such multipliers whose exceptional sets have empty intersection.

    ∂̄-estimates (Theorems 1 and 2, Proposition 1). For such weights the equation ∂̄u = f has an
    explicit solution, built from the multipliers and a model kernel, with weighted L^p and sup
    estimates:
      - Theorem 1: in ℂ, Christ's theorem extended to locally doubling Laplacians;
      - Theorem 2: in 𝔻, with the norms ‖u e^{-φ}‖_{L^p(dm/(1−|z|²))}.

    The real line (Theorems 5 and 3). Multipliers with real zeros for Laplacians carried by ℝ.
    Theorem 3, a weighted estimate for ∂̄u = μ, is conditional on the Ortega-Cerdà–Seip theorem
    the paper quotes. As printed it is false; the corrected statement is formalized.

    Weights are pairs (φ, μ): φ continuous and Δφ = μ in the sense of distributions. Mathlib has
    no Riesz-measure theory, and for the paper's weights this class is equivalent to the
    paper's.

    The formalization was directed by the author of the paper. It also serves the companion
    formalization of Berndtsson–Ortega-Cerdà (1995): Theorem 2 replaces the external Theorem G
    used there.
  authors:
    - "Claude Opus 5.5 (Anthropic), multi-agent run in Claude Code"
    - "Joaquim Ortega-Cerdà (direction)"
  responsible_maintainers:
    - "Joaquim Ortega-Cerdà"
  license: "Apache-2.0"

sources:
  - title: "Multipliers and weighted ∂̄-estimates"
    authors:
      - "Joaquim Ortega-Cerdà"
    id: "Rev. Mat. Iberoamericana 18 (2002), no. 2, 355–377; doi:10.4171/RMI/322; arXiv:math/9912139"
    type: "article"
    location: "Theorems 1–5, Propositions 1–2, Lemmas 1–8 (Sections 2–4)"
    relationship: "formalizes"
    note: >-
      Statements of the published version (the printed PDF, doi:10.4171/rmi/322). Errata, gaps
      and simplifications found in the source are recorded in NOTEBOOK.md. Among them, Theorem 3
      as printed is false and is replaced by a corrected form (NOTEBOOK N-01).
    author_endorsement: "participated"
  - title: "Multipliers for entire functions and an interpolation problem of Beurling"
    authors:
      - "Joaquim Ortega-Cerdà"
      - "Kristian Seip"
    id: "J. Funct. Anal. 162 (1999), 400–415 (cited as [OCS99] in the article)"
    type: "article"
    location: "The theorem quoted on p. 375 of the article (Lemma 4 of [OCS99])"
    relationship: "background"
    note: >-
      Not proved. Used as the explicit hypothesis OC.TheoremOCS of OC.theorem3_weighted, in the
      form quoted on p. 375, which has limsup |u|e^{-α|Im z|} = 0. The published lemma states only
      limsup < ∞; the "= 0" version follows from its proof (checked by a referee agent). See
      NOTEBOOK N-07.
    author_endorsement: "participated"
  - title: "On the ∂̄ equation in weighted L² norms in C¹"
    authors:
      - "Michael Christ"
    id: "J. Geom. Anal. 1 (1991), 193–230 (cited as [Chr91])"
    type: "article"
    location: "Lemmas 2.1 and 2.3, used in Section 2 of the article"
    relationship: "background"
    note: "Not assumed: the two lemmas used are proved (blueprint M03)."
    author_endorsement: "n/a"

related_formalizations:
  - name: "Berndtsson–Ortega-Cerdà (1995), Lean formalization"
    id: "https://github.com/joaquimortega/MR1340337"
    url: "https://github.com/joaquimortega/MR1340337"
    relationship: "other"
    note: >-
      The companion project uses OC.theorem2_uniform to prove its Theorem 6 without the
      external Theorem G (its blueprint M23).

