automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        A coordinating Claude Code session delegated work to background subagents. In total
        there were about 30, at most 7–8 at a time, each with full shell access to Lean/Lake and
        the Mathlib sources.

        Isolation. Each implementation subagent worked on its own git branch, in a separate git
        worktree sharing the prebuilt Mathlib packages through a symlink. The coordinator merged
        the branches into main after building and running scripts/check_statements.py, which
        verifies that no statement changed since the reviewed scaffold.

        Foundation files were copied (not imported) from the companion BOC project, which itself
        will depend on this project. Verification: comparator, run under systemd-run.
      cost:
        wall_time: "2026-11-01, 12:40 CET onwards (interrupted once by a usage limit)"
        hardware: "API-only models; local workstation (16 cores, 31 GB RAM) for Lean builds"
      prompting_notes: >-
        The user asked for "a full formalization as the previous project", with its own git
        repository. The workflow was the same:
          1. Defs, main statements and the blueprint index by the coordinator.
          2. Module blueprints by 8 agents.
          3. A compiling scaffold by one agent.
          4. Independent review by three referee agents:
             - a statement auditor;
             - two mathematical referees reading the page images.
          5. Implementation agents per module, told "never change a statement; if false, mark it
             FALSE? and report".
          6. Coordinator merges with a statement freeze-check.
  spend_usd: "not tracked (subscription usage)"
  notes: >-
    Statement problems caught by the process:
      - The printed Theorem 3 is false. M14's blueprint writer found a counterexample, and both
        the statement auditor and the M08–M14 referee confirmed it. Before implementation it was
        replaced by the weighted form (NOTEBOOK N-01).
      - Proposition 2 as first drafted lacked the Theorem-4 bounds for each multiplier, which the
        article includes and Theorem 2's proof needs. It was strengthened before implementation.
      - A uniform version of Theorem 2 (theorem2_uniform) was added for the BOC application.
      - Implementation found two false helper statements in the scaffold, not in the article:
        - a Forelli–Rudin bound missing s ≤ 1;
        - a lemma whose `∫ z, a - b` parsed as `∫ z, (a - b)`.
        Both were unused and were removed, with corrected versions proved (NOTEBOOK I-01,
        I-03); the freeze-check lists them as approved removals.

fidelity:
  divergences: >-
    1. Weights are pairs (φ, μ) with φ continuous and Δφ = μ weakly (IsSubharmonicWeight).
       - The article's weights are subharmonic with locally doubling Riesz measure; these are
         automatically continuous ([Chr91, Lemma 2.3]).
       - So the classes coincide, but the implication "subharmonic ⇒ continuous" is not
         formalized: Mathlib has no Riesz decomposition.
    2. Hyperbolic distance β = artanh ρ. The article fixes no normalisation; any choice only
       rescales radii.
    3. Theorem 1 is formalized in the locally doubling form the article's proof gives (as its
       remark on p. 357 says); Christ's doubling form is a corollary.
    4. Theorem 2.
       - theorem2 states, for one solution u and all p ∈ [1, ∞] at once, bounds on
         ‖u e^{-φ}‖_{L^p(dm/(1−|z|²))}. This is what the proof gives, and p = ∞ is the printed
         sup estimate.
       - The printed L^p estimate with weight e^{-φ} for every p is proved only for p = 1 by
         the article's argument. theorem2_printed proves it with u depending on p.
       - theorem2_uniform makes the constant depend only on the doubling constant and the mass
         radius.
    5. Proposition 1: only the upper bound. The printed two-sided ≃ is false (NOTEBOOK N-03).
    6. Theorem 3: corrected statement with the weighted integral ∫ e^{-φ(z)} d|μ|(z)/|x−z|. The
       printed one is false (NOTEBOOK N-01). The solution is required to be holomorphic off the
       compact support of μ, so that its pointwise values on ℝ are meaningful.
    7. Theorem 4: the inequalities are printed in reversed order; the formal statement uses the
       correct order (NOTEBOOK N-02). h ≢ 0 is added to exclude a vacuous h ≡ 0.
    8. Proof-level changes:
       - moment matching of order 3 in 2D (2 on ℝ) by area counting, instead of the article's
         order m with mγ > 1;
       - disc cells: moment-matched nodes for small cells and barycentres for large ones, since
         "nodes inside R" is false;
       - real zeros in Theorem 5 by barycentres instead of Chebyshev quadrature;
       - horocyclic boxes instead of polar rectangles in the disc;
       - local radial potentials instead of the article's global kernels in Lemma 6;
       - the auxiliary weight in Theorem 2 with the corrected sign.

review:
  status: "agent-reviewed"
  reviewers:
    - "Independent Claude agent (statement auditor: fidelity, falsity, vacuity of the main statements)"
    - "Independent Claude agent (mathematical referee, modules M02–M07, against the page images)"
    - "Independent Claude agent (mathematical referee, modules M08–M14, against the page images)"
  notes: >-
    Full referee reports are in reviews/. They confirmed most claimed errata against the printed
    pages, refuted one (an OCR artefact), and identified the false printed Theorem 3, which two
    agents verified independently. Their interface findings (uniform constants, the L¹_loc Weyl
    lemma) were applied in the scaffold before implementation.

alignment:
  namespace: "OC"
  statements:
    - source: "Definitions: subharmonic weight, locally doubling (p. 359), ρ(z) (p. 361), hyperbolic discs, two-sided Carleson (p. 358)"
      lean: "OC.IsSubharmonicWeight, OC.IsLocallyDoubling, OC.IsLocallyDoublingDisc, OC.IsLocallyDoublingLine, OC.massRadius, OC.hypBall, OC.IsTwoSidedCarleson"
      module: "OrtegaCerdaMultipliers/Defs.lean"
      status: "proved"
      note: "definitions"
    - source: "Lemmas 1–3, Claim 1 (Section 2); [Chr91, Lemmas 2.1, 2.3]"
      lean: "OC.lemma1_*, OC.lemma2_*, OC.lemma3_*, OC.claim1_*, OC.christ_*"
      module: "OrtegaCerdaMultipliers/Doubling/"
      status: "proved"
    - source: "Lemma 4, Claim 2 (Section 3)"
      lean: "OC.lemma4_plane, OC.lemma4_disc, OC.lemma4_*_quant"
      module: "OrtegaCerdaMultipliers/Partition/"
      status: "proved"
    - source: "Lemma 5 (Section 3)"
      lean: "OC.lemma5, OC.lemma5_moments"
      module: "OrtegaCerdaMultipliers/Quadrature.lean"
      status: "proved"
      note: "nodes near R (inside R is false, NOTEBOOK N-13)"
    - source: "Theorem 4"
      lean: "OC.theorem4_disc, OC.theorem4_plane"
      module: "OrtegaCerdaMultipliers/Multiplier/Theorem4.lean"
      status: "proved"
    - source: "Proposition 2"
      lean: "OC.prop2_disc, OC.prop2_plane"
      module: "OrtegaCerdaMultipliers/SeveralMultipliers.lean"
      status: "proved"
    - source: "Lemma 6 (Section 4.1)"
      lean: "OC.lemma6_disc, OC.lemma6_disc_quant, OC.lemma6_plane"
      module: "OrtegaCerdaMultipliers/Regularization.lean"
      status: "proved"
    - source: "Lemmas 7, 8 (Section 4.2)"
      lean: "OC.lemma7, OC.lemma8"
      module: "OrtegaCerdaMultipliers/ModelKernels.lean"
      status: "proved"
    - source: "Theorem 2"
      lean: "OC.theorem2, OC.theorem2_uniform, OC.theorem2_printed"
      module: "OrtegaCerdaMultipliers/Theorem2.lean"
      status: "proved"
    - source: "Theorem 1, Proposition 1"
      lean: "OC.theorem1, OC.theorem1_christ, OC.prop1"
      module: "OrtegaCerdaMultipliers/Theorem1.lean"
      status: "proved"
    - source: "Theorem 5"
      lean: "OC.theorem5"
      module: "OrtegaCerdaMultipliers/Theorem5.lean"
      status: "proved"
    - source: "Theorem 3 (corrected)"
      lean: "OC.theorem3_weighted"
      module: "OrtegaCerdaMultipliers/Theorem3.lean"
      status: "literature-dependency"
      note: "conditional on OC.TheoremOCS, the [OCS99] theorem as quoted on p. 375; the printed statement is false (NOTEBOOK N-01)"
    - source: "Holomorphic functions with prescribed log-modulus (p. 366, implicit)"
      lean: "OC.exists_analytic_norm_eq_exp"
      module: "OrtegaCerdaMultipliers/LogModulus.lean"
      status: "proved"

acknowledgements: >-
  Built on Mathlib. Particularly useful were:
    - Kebekus et al.'s harmonic-function API (harmonic functions as real parts on balls);
    - Newton's identities and Vieta's formulas for polynomials;
    - Besicovitch–Vitali covering and Lebesgue differentiation;
    - the polar-coordinate and Möbius changes of variables.
  Foundation files (∂̄ calculus, Cauchy transform, Weyl's lemma for ∂̄, disc geometry) come from
  the companion BOC formalization. Verification used leanprover/comparator, landrun and
  lean4export.
